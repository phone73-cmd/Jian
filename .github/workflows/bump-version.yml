name: Bump version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(grep -o '"version": *"[0-9]*\.[0-9]*\.[0-9]*"' manifest.json | grep -o '[0-9]*\.[0-9]*\.[0-9]*')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          # Patch and minor carry at 10: 1.0.9 -> 1.1.0, 1.9.9 -> 2.0.0 (an old patch of 10 or more also carries).
          PATCH=$((PATCH + 1))
          if [ "$PATCH" -ge 10 ]; then PATCH=0; MINOR=$((MINOR + 1)); fi
          if [ "$MINOR" -ge 10 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); fi
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          # Escape dots and anchor each replacement: a bare "1.0.1" regex also matched "140,1" inside CSS.
          OLD_RE=$(printf '%s' "$OLD_VERSION" | sed 's/\./\\./g')
          sed -i "s/const APP_VERSION = '$OLD_RE';/const APP_VERSION = '$NEW_VERSION';/" index.html
          sed -i "s/\"version\": \"$OLD_RE\"/\"version\": \"$NEW_VERSION\"/" manifest.json
          sed -i "s/dictation-note-v$OLD_RE'/dictation-note-v$NEW_VERSION'/" sw.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.json sw.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new }} [skip ci]"
          git push
