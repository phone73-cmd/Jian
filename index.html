<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>지안이 칭찬스티커</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8067DC">
<script>try{var t=localStorage.getItem('stamp-theme')||'light';if(t!=='system')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="칭찬스티커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#FFF6DC; --paper:#FFFDF7; --ink:#3A3238; --sub:#8A7E68;
    --coral:#FF8C7A; --yellow:#FFD166; --grape:#8067DC; --mint:#7FD1C0; --line:#F0E4C8;
    --soft:#F0EBDC; --cell:#FBF8EE; --sel-bg:#F1EDFB; --del-bg:#FBE3DD; --back-bg:#EEF0FB;
    --sun:#E8877A; --sat:#8B7FD1; --dot:#F3E4BE; --on-yellow:#3A3238;
    --bg-tint:rgba(255,246,220,0.72); --bg-tint-photo:rgba(255,251,240,0.62); --dim:rgba(58,50,56,0.35);
    --shadow: 0 6px 0 rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#1B1820; --paper:#26222C; --ink:#EEE8F0; --sub:#A79FAE;
      --coral:#FF9A8A; --yellow:#F2C25B; --grape:#8E7AEA; --line:#3A3440;
      --soft:#332E39; --cell:#221E27; --sel-bg:#3A3358; --del-bg:#4A2A2E; --back-bg:#2E2A45;
      --sun:#FF9E90; --sat:#A99CF0; --dot:#2A2530;
      --bg-tint:rgba(27,24,32,0.72); --bg-tint-photo:rgba(20,18,24,0.62); --dim:rgba(0,0,0,0.55);
      --shadow: 0 6px 0 rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#1B1820; --paper:#26222C; --ink:#EEE8F0; --sub:#A79FAE;
    --coral:#FF9A8A; --yellow:#F2C25B; --grape:#8E7AEA; --line:#3A3440;
    --soft:#332E39; --cell:#221E27; --sel-bg:#3A3358; --del-bg:#4A2A2E; --back-bg:#2E2A45;
    --sun:#FF9E90; --sat:#A99CF0; --dot:#2A2530;
    --bg-tint:rgba(27,24,32,0.72); --bg-tint-photo:rgba(20,18,24,0.62); --dim:rgba(0,0,0,0.55);
    --shadow: 0 6px 0 rgba(0,0,0,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overscroll-behavior-x:none;}
  /* Horizontal swipes on the calendar change the month; keep the browser from treating them as back/forward. */
  #mainArea{ touch-action:pan-y; }
  #bgLayer{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(circle at 2px 2px, var(--dot) 1.4px, transparent 1.4px) 0 0/22px 22px,
      var(--bg);
    background-size:cover; background-position:center;
  }
  #bgTint{ position:fixed; inset:0; z-index:-1; background:var(--bg-tint); backdrop-filter: blur(0px); }
  body.has-bg #bgTint{ background:var(--bg-tint-photo); }
  body{
    min-height:100vh; font-family:'Gowun Dodum','Noto Sans KR',sans-serif; color:var(--ink);
    display:flex; justify-content:center; padding:20px 12px 60px;
  }
  .app{ width:100%; max-width:480px; animation: appLoadIn .5s ease both; }
  @keyframes appLoadIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .title-row{ text-align:center; margin-bottom:14px; position:relative; }
  .title-row h1{ font-family:'Jua',sans-serif; font-weight:400; font-size:26px; color:var(--grape); margin:0 0 2px; letter-spacing:-0.5px; }
  .settings-btn{
    position:absolute; right:0; top:0; width:38px; height:38px; border-radius:50%;
    border:none; background:var(--paper); box-shadow:0 3px 0 rgba(0,0,0,0.06); font-size:19px; cursor:pointer;
    color:var(--ink); transition:transform .12s ease;
  }
  .settings-btn:active{ transform:scale(0.92); }

  .top-tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .top-tab{
    flex:1; text-align:center; padding:11px 6px; border-radius:16px; background:var(--soft);
    color:var(--sub); font-weight:700; font-size:14px; cursor:pointer; border:2px solid transparent;
    transition: background-color .2s ease, color .2s ease, transform .12s ease;
  }
  .top-tab:active{ transform:scale(0.96); }
  .top-tab.active{ background:var(--grape); color:#fff; }

  .card{
    background:var(--paper); border-radius:26px; padding:16px 14px 20px;
    box-shadow:var(--shadow), 0 2px 14px rgba(58,50,56,0.08); border:1px solid var(--line); margin-bottom:14px;
  }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:6px; }
  .month-nav button{
    width:36px;height:36px; border-radius:50%; border:none; background:var(--yellow);
    font-family:'Jua',sans-serif; font-size:16px; color:var(--on-yellow); cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,0.08);
    flex:0 0 auto; transition: transform .12s ease, box-shadow .12s ease;
  }
  .month-nav button:active{ transform:translateY(2px) scale(0.96); box-shadow:none; }
  .month-nav h2{ font-family:'Jua',sans-serif; font-weight:400; font-size:19px; margin:0; color:var(--ink); flex:1; text-align:center; }
  /* 월별 캘린더: 제목·목표·날짜 칸이 한 "페이지"이고, 페이지들이 손가락을 따라 옆으로 밀린다. ‹ › 버튼은 제자리에 고정. */
  .month-card{ position:relative; }
  .month-card .month-nav{ position:absolute; left:14px; right:14px; top:16px; margin:0; z-index:2; pointer-events:none; }
  .month-card .month-nav button{ pointer-events:auto; }
  /* "오늘" 버튼: 연월 제목 아래 가운데에 고정. 이번 달을 보고 있을 때는 비활성. */
  .today-btn{
    position:absolute; top:54px; left:0; right:0; margin:0 auto; width:fit-content; z-index:2; height:24px; padding:0 12px; border-radius:12px;
    border:1.5px solid var(--grape); background:var(--sel-bg); color:var(--grape);
    font-family:'Jua',sans-serif; font-size:12px; line-height:1; cursor:pointer; transition:transform .12s ease;
  }
  .today-btn:not(:disabled):active{ transform:scale(0.94); }
  .today-btn:disabled{ border-color:var(--line); background:transparent; color:var(--sub); opacity:.6; cursor:default; }
  .pager{ margin:0 -14px; }
  .pager.sliding{ overflow:hidden; }
  .pager .track{ display:flex; align-items:flex-start; }
  .pager.sliding .track{ will-change:transform; }
  .pager .page{ flex:0 0 100%; min-width:0; padding:0 14px; }
  .page-title{ font-family:'Jua',sans-serif; font-weight:400; font-size:19px; margin:0 0 34px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--ink); }
  .month-nav h2{ min-width:0; word-break:keep-all; overflow-wrap:anywhere; }
  .month-nav h2 span{ min-width:0; }
  .month-nav h2.editable{ display:flex; align-items:center; justify-content:center; gap:6px; }
  .month-nav h2 .edit-title{ width:26px; height:26px; font-size:12px; box-shadow:none; background:var(--soft); color:var(--grape); }
  .title-row h1{ padding:0 44px; word-break:keep-all; overflow-wrap:anywhere; }
  .title-row h1.long{ font-size:20px; }
  .month-nav .del{ background:var(--del-bg); color:var(--coral); font-size:12px; width:auto; padding:0 10px; border-radius:12px; }
  .month-nav .back{ background:var(--back-bg); color:var(--grape); font-size:13px; width:auto; padding:0 12px; border-radius:12px; }

  .progress-block + .progress-block{ margin-top:14px; }
  .progress-label{ font-size:12px; color:var(--grape); font-weight:700; margin-bottom:4px; }
  .progress-msg{ font-size:13px; color:var(--grape); margin-bottom:6px; font-weight:600; text-align:center; }
  .progress-bar{ height:12px; background:var(--soft); border-radius:8px; overflow:hidden; position:relative; }
  .progress-fill{ height:100%; background:linear-gradient(90deg,var(--coral),var(--yellow)); border-radius:8px; transition:width .6s cubic-bezier(.2,.8,.3,1); }
  @keyframes glowPulse{ 0%,100%{ box-shadow:0 0 6px 1px rgba(255,209,102,0.55); } 50%{ box-shadow:0 0 14px 4px rgba(255,140,122,0.85); } }
  .progress-fill.complete{ animation: glowPulse 1.4s ease-in-out infinite; }
  .goal-row{ display:flex; justify-content:space-between; font-size:11px; color:var(--sub); margin-top:4px; }
  .goal-row input{ width:38px; border:none; border-bottom:1px solid var(--sub); background:transparent; text-align:center; font-size:11px; color:var(--sub); }

  .period-info{ text-align:center; font-size:12px; color:var(--sub); margin-bottom:10px; }

  .weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px; }
  .weekdays div{ text-align:center; font-size:12px; color:var(--sub); font-weight:600; }
  .weekdays div:nth-child(1){ color:var(--coral); }
  .weekdays div:nth-child(7){ color:var(--grape); }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cell{
    position:relative; aspect-ratio:1/1; border-radius:14px; background:var(--cell);
    border:1.5px solid var(--line); display:flex; align-items:flex-start; justify-content:flex-start;
    cursor:pointer; overflow:visible; -webkit-tap-highlight-color:transparent;
  }
  .cell.empty{ background:transparent; border:none; cursor:default; }
  .cell.today{ border-color:var(--coral); border-width:2px; }
  .daynum{ font-size:11px; color:var(--sub); padding:4px 6px; font-weight:600; z-index:2; }
  .cell.sun .daynum{ color:var(--sun); }
  .cell.sat .daynum{ color:var(--sat); }
  .stamp{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .stamp .badge{ font-size:30px; filter: drop-shadow(0 2px 1px rgba(0,0,0,0.15)); transform-origin:center; display:inline-block; }
  @keyframes stampDown{
    0%{ transform:scale(2.6) rotate(var(--rot,0deg)); opacity:0; }
    50%{ transform:scale(0.8) rotate(calc(var(--rot,0deg) - 8deg)); opacity:1; }
    68%{ transform:scale(1.16) rotate(calc(var(--rot,0deg) + 5deg)); }
    84%{ transform:scale(0.95) rotate(calc(var(--rot,0deg) - 2deg)); }
    100%{ transform:scale(1) rotate(var(--rot,0deg)); opacity:1; }
  }
  .stamp.pop .badge{ animation: stampDown .48s cubic-bezier(.2,1.4,.4,1) both; }
  .ring{ position:absolute; inset:0; border-radius:50%; border:3px solid currentColor; opacity:0; }
  @keyframes ringPulse{ 0%{ transform:scale(0.4); opacity:.55; } 100%{ transform:scale(1.6); opacity:0; } }
  .stamp.pop .ring{ animation: ringPulse .5s ease-out both; }
  .note-dot{ position:absolute; bottom:4px; right:5px; width:6px;height:6px; border-radius:50%; background:var(--mint); z-index:3; }

  .period-card{
    background:var(--cell); border:1.5px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .period-card:active{ transform:scale(0.98); }
  .period-card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .period-card-head strong{ font-family:'Jua',sans-serif; font-weight:400; font-size:15px; color:var(--ink); }
  .period-card-head span{ font-size:11px; color:var(--sub); }
  .mini-bar{ height:9px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:6px; }
  .mini-fill{ height:100%; background:linear-gradient(90deg,var(--coral),var(--yellow)); }
  .mini-count{ font-size:11px; color:var(--sub); margin-top:4px; text-align:right; }
  .add-period-btn{
    width:100%; padding:13px; border-radius:16px; border:2px dashed var(--sub); background:transparent;
    color:var(--sub); font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; transition: transform .12s ease;
  }
  .add-period-btn:active{ transform:scale(0.97); }
  .empty-msg{ text-align:center; font-size:13px; color:var(--sub); padding:14px 0; }

  .overlay{
    position:fixed; inset:0; background:var(--dim);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .sheet{
    width:100%; max-width:480px; background:var(--paper); border-radius:26px 26px 0 0;
    padding:18px 18px 26px; transform:translateY(30px); transition:transform .32s cubic-bezier(.34,1.45,.64,1);
    box-shadow:0 -6px 24px rgba(0,0,0,0.15); max-height:85vh; overflow-y:auto;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .sheet-head h3{ font-family:'Jua',sans-serif; font-weight:400; font-size:17px; margin:0; color:var(--ink); }
  .sheet-head button{ border:none; background:var(--soft); width:30px;height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:var(--sub); }
  .sticker-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
  .sticker-btn{
    aspect-ratio:1/1; border-radius:18px; border:2px solid var(--line); display:flex;
    align-items:center; justify-content:center; font-size:30px; cursor:pointer; transition:transform .12s ease; background:var(--cell);
  }
  .sticker-btn:active{ transform:scale(0.88); }
  .sticker-btn.selected{ border-color:var(--grape); background:var(--sel-bg); box-shadow:0 0 0 2px var(--grape) inset; }
  .note-input{
    width:100%; min-height:64px; border-radius:14px; border:1.5px solid var(--line); background:var(--cell);
    padding:10px 12px; font-family:'Gowun Dodum',sans-serif; font-size:13px; color:var(--ink);
    resize:none; margin-bottom:10px; outline:none;
  }
  .note-input:focus{ border-color:var(--mint); }
  .field-label{ font-size:12px; color:var(--sub); margin:8px 2px 4px; font-weight:600; }
  .field-input{
    width:100%; padding:9px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--cell); font-family:'Gowun Dodum',sans-serif; font-size:14px; color:var(--ink); outline:none;
  }
  .field-input:focus{ border-color:var(--mint); }
  .field-row{ display:flex; gap:8px; }
  .field-row > div{ flex:1; }
  .save-btn{
    width:100%; padding:11px; border-radius:14px; border:none; background:var(--grape); color:#fff;
    font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; margin-bottom:8px; margin-top:6px;
    transition: transform .12s ease;
  }
  .save-btn:active{ transform:translateY(1px) scale(0.98); }
  .remove-btn{
    width:100%; padding:10px; border-radius:14px; border:1.5px dashed var(--sub); background:transparent;
    color:var(--sub); font-family:'Gowun Dodum',sans-serif; font-size:13px; cursor:pointer;
  }
  .confetti{ position:fixed; width:8px;height:8px; border-radius:2px; pointer-events:none; z-index:60; }
  .err-msg{ font-size:12px; color:var(--coral); margin-top:4px; min-height:14px; }

  .bg-preview{
    width:100%; height:120px; border-radius:14px; background:var(--soft) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center; color:var(--sub); font-size:12px; margin-bottom:12px; border:1.5px dashed var(--line);
  }
  .file-btn{
    display:block; width:100%; text-align:center; padding:11px; border-radius:14px; background:var(--mint);
    color:#fff; font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; margin-bottom:8px;
  }
  .file-btn input{ display:none; }

  #pullIndicator{
    position:fixed; top:env(safe-area-inset-top, 0px); left:0; width:0; height:3px;
    background:var(--grape); border-radius:0 3px 3px 0;
    opacity:0; z-index:100; pointer-events:none;
    transition: opacity .25s ease;
  }
  #pullIndicator.refreshing{
    width:100% !important; border-radius:0;
    background:linear-gradient(90deg, transparent, var(--grape), transparent) no-repeat;
    background-size:45% 100%;
    animation: pullSweep 1s linear infinite;
  }
  @keyframes pullSweep{ from{ background-position:-60% 0; } to{ background-position:160% 0; } }
  #appVersion{ text-align:center; font-size:10px; color:var(--sub); margin-top:2px; opacity:.6; }

  .cfg-sub{ font-size:12px; color:var(--sub); margin:-6px 0 4px 2px; }
  .cfg-title{ display:flex; align-items:center; gap:7px; font-family:'Jua',sans-serif; font-weight:400; font-size:15px; color:var(--ink); margin:18px 0 7px; }
  .cfg-title::before{ content:''; width:4px; height:16px; border-radius:4px; background:var(--grape); flex:none; }
  .seg{ display:flex; gap:8px; }
  .seg-opt{ position:relative; flex:1; min-width:0; }
  .seg-opt input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; }
  .seg-opt span{
    display:block; padding:10px 6px; text-align:center; font-size:14px; color:var(--ink);
    border:1.5px solid var(--line); border-radius:13px; background:var(--cell);
    transition:border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .seg-opt input:checked + span{ border-color:var(--grape); background:var(--sel-bg); color:var(--grape); font-weight:700; }
  .seg-opt input:focus-visible + span{ outline:2px solid var(--grape); outline-offset:2px; }
  .cgrid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:6px 0 10px; }
  .csw{
    width:100%; aspect-ratio:1/1; border-radius:14px; border:2px solid var(--line); background:var(--paper);
    color:var(--sub); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .csw.on{ border-color:var(--ink); box-shadow:0 0 0 2px var(--ink) inset; }
  .pill-row{ display:flex; gap:8px; margin:0 0 4px; }
  .pill{
    flex:1; padding:8px; border-radius:12px; border:1.5px solid var(--line); background:var(--cell);
    color:var(--sub); font-family:'Gowun Dodum',sans-serif; font-size:13px; cursor:pointer;
  }
  .pill.on{ border-color:var(--grape); background:var(--sel-bg); color:var(--grape); font-weight:700; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="bgTint"></div>
<div id="pullIndicator" aria-hidden="true"></div>
<div class="app">
  <div class="title-row">
    <h1 id="appTitle">🌟 지안이 칭찬스티커 🌟</h1>
    <button class="settings-btn" id="settingsBtn" aria-label="설정">⚙</button>
    <div id="syncStatus" style="font-size:11px;color:var(--sub);margin-top:2px;"></div>
  </div>

  <div class="top-tabs">
    <div class="top-tab" id="tabMonth">📅 월별 캘린더</div>
    <div class="top-tab" id="tabPeriod">🎯 목표기간 캘린더</div>
  </div>

  <div id="mainArea"></div>

  <div id="appVersion"></div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetDateLabel">기록하기</h3>
      <button id="closeSheet">✕</button>
    </div>
    <div class="sticker-grid" id="stickerGrid"></div>
    <textarea id="noteInput" class="note-input" maxlength="120" placeholder="오늘 잘한 일을 적어주세요 (예: 혼자 양치했어요)"></textarea>
    <button class="save-btn" id="saveDayBtn">저장하기</button>
    <button class="remove-btn" id="removeStampBtn">이 날짜 기록 지우기</button>
  </div>
</div>

<div class="overlay" id="periodOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>목표기간 캘린더 만들기</h3>
      <button id="closePeriodSheet">✕</button>
    </div>
    <div class="field-label">캘린더 이름</div>
    <input class="field-input" id="periodName" maxlength="16" placeholder="예: 여름방학, 태권도 승급 준비">
    <div class="field-row">
      <div><div class="field-label">시작일</div><input class="field-input" id="periodStart" type="date"></div>
      <div><div class="field-label">종료일</div><input class="field-input" id="periodEnd" type="date"></div>
    </div>
    <div class="field-label">목표 도장 개수</div>
    <input class="field-input" id="periodGoal" type="number" min="1" max="365" value="10">
    <div class="err-msg" id="periodErr"></div>

function animateMainAreaIn(direction){
  mainArea.style.animation = 'none';
  if(direction==='none') return;
  void mainArea.offsetWidth; // reflow to restart animation
  mainArea.style.animation = 'fadeSlideIn .28s ease both';
}
function animateCountUps(instant){
  mainArea.querySelectorAll('.count-num').forEach(el=>{
    const target = parseInt(el.dataset.target)||0;
    if(instant){ el.textContent = target; return; }
    el.textContent = '0';
    const start = performance.now();
    const dur = 450;
    function step(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(target*eased);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function animateStampPop(key){
  requestAnimationFrame(()=>{
    const cell = mainArea.querySelector(`[data-key="${key}"]`);
    const stampEl = cell && cell.querySelector('.stamp');
    if(!stampEl) return;
    stampEl.style.setProperty('--rot', (Math.random()*16-8).toFixed(1)+'deg');
    stampEl.classList.add('pop');
  });
}

const mainArea = document.getElementById('mainArea');

function pad(n){ return String(n).padStart(2,'0'); }
function stampKey(ds){ return `stamp:${ds}`; }
function goalKey(d){ return `goal:${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function dateStr(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

/* ---------- 저장소 계층: localStorage 캐시 + (설정 시) Supabase 동기화 ---------- */
let dbCache = {};
let sbConfig = null;   // {url, key, appId}
let sbClient = null;
let sbChannel = null;

function loadLocalDB(){
  try{ const raw = localStorage.getItem('appDB'); dbCache = raw ? JSON.parse(raw) : {}; }
  catch(e){ dbCache = {}; }
}
function persistLocalDB(){
  try{ localStorage.setItem('appDB', JSON.stringify(dbCache)); }catch(e){ console.error('로컬 저장 실패', e); }
}
function loadSbConfig(){
  try{ const raw = localStorage.getItem('sbConfig'); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function saveSbConfigToStorage(cfg){ try{ localStorage.setItem('sbConfig', JSON.stringify(cfg)); }catch(e){} }
function clearSbConfigFromStorage(){ try{ localStorage.removeItem('sbConfig'); }catch(e){} }

function sbRestUrl(path){ return `${sbConfig.url.replace(/\/$/,'')}/rest/v1/${path}`; }
function sbHeaders(){
  return { 'apikey': sbConfig.key, 'Authorization': `Bearer ${sbConfig.key}`, 'Content-Type':'application/json' };
}

async function supabaseLoadAll(){
  if(!sbConfig) return {ok:false};
  try{
    const res = await fetch(sbRestUrl(`app_data?app_id=eq.${encodeURIComponent(sbConfig.appId)}&select=key,value`), {
      headers: sbHeaders(),
      cache: 'no-store'
    });
    if(!res.ok){ const d = await res.json().catch(()=>({})); return {ok:false, error: d.message || ('HTTP '+res.status)}; }
    const rows = await res.json();
    dbCache = {};
    rows.forEach(r=>{ dbCache[r.key] = r.value; });
    persistLocalDB();
    return {ok:true};
  }catch(e){ return {ok:false, error: e.message || String(e)}; }
}

/* entries: [[key, value], ...] — 한 번의 요청으로 여러 행을 저장한다. 성공하면 true. */
async function supabaseUpsertRows(entries){
  if(!sbConfig) return true;
  try{
    const now = new Date().toISOString();
    const res = await fetch(sbRestUrl('app_data?on_conflict=app_id,key'), {
      method:'POST',
      headers:{ ...sbHeaders(), 'Prefer':'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(entries.map(([key, value])=>({ app_id: sbConfig.appId, key, value, updated_at: now })))
    });
    if(!res.ok){ const d = await res.json().catch(()=>({})); throw new Error(d.message || ('HTTP '+res.status)); }
    setSyncStatus(`☁️ 저장됨 (${nowTime()})`);
    return true;
  }catch(e){
    console.error('Supabase 저장 실패', e);
    showSaveError('⚠️ Supabase 저장에 실패했어요 (' + (e.message||'') + ')');
    setSyncStatus(`⚠️ 저장 실패 (${nowTime()}) — 이 기기에만 저장됨: ${e.message||''}`);
    return false;
  }
}
function supabaseUpsert(key, value){ return supabaseUpsertRows([[key, value]]); }

async function supabaseDeleteKey(key){
  if(!sbConfig) return true;
  try{
    const res = await fetch(sbRestUrl(`app_data?app_id=eq.${encodeURIComponent(sbConfig.appId)}&key=eq.${encodeURIComponent(key)}`), {
      method:'DELETE', headers: sbHeaders()
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    setSyncStatus(`☁️ 저장됨 (${nowTime()})`);
    return true;
  }catch(e){
    console.error('Supabase 삭제 실패', e);
    setSyncStatus(`⚠️ 삭제 실패 (${nowTime()}) — 이 기기에만 반영됨: ${e.message||''}`);
    return false;
  }
}

function setSyncStatus(text){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = sbConfig ? text : '';
}

/* ---------- 실시간 동기화: 다른 기기 변경사항을 새로고침 없이 반영 ---------- */
function waitForSbLib(){
  if(window.__sbCreateClient) return Promise.resolve(window.__sbCreateClient);
  return new Promise(resolve=>{
    const check = ()=> window.__sbCreateClient ? resolve(window.__sbCreateClient) : setTimeout(check, 50);
    check();
  });
}
async function connectRealtime(){
  if(!sbConfig) return;
  try{
    const createClient = await waitForSbLib();
    sbClient = createClient(sbConfig.url, sbConfig.key);
    sbChannel = sbClient.channel('app_data_changes')
      .on('postgres_changes', { event:'*', schema:'public', table:'app_data', filter:`app_id=eq.${sbConfig.appId}` }, handleRemoteChange)
      .subscribe((status)=>{
        if(status==='SUBSCRIBED') setSyncStatus('☁️ Supabase 연동됨 (실시간 연결됨)');
        else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
          setSyncStatus('⚠️ 실시간 연결 끊김 — 곧 자동으로 재연결해요');
        }
      });
  }catch(e){ console.error('실시간 연결 실패', e); }
}
function disconnectRealtime(){
  if(sbClient && sbChannel) sbClient.removeChannel(sbChannel);
  sbClient = null; sbChannel = null;
}
function reconnectRealtime(){
  disconnectRealtime();
  connectRealtime();
}
let remoteRenderTimer = null;
function handleRemoteChange(payload){
  const row = payload.eventType==='DELETE' ? payload.old : payload.new;
  if(!row) return;
  // Supabase can't filter DELETE events by app_id, so skip rows that belong to another family.
  if(row.app_id && sbConfig && row.app_id !== sbConfig.appId) return;
  if(payload.eventType==='DELETE') delete dbCache[row.key];
  else dbCache[row.key] = row.value;
  persistLocalDB();
  // A batch of saves arrives as many events; redraw once after they settle.
  clearTimeout(remoteRenderTimer);
  remoteRenderTimer = setTimeout(reloadCurrentView, 150);
}
async function reloadCurrentView(){
  applyTitle();
  if(slide) return; // 슬라이드가 끝나면 어차피 최신 데이터로 다시 그린다
  if(topTab==='month') renderAll();
  else if(periodSub==='list'){ await loadPeriods(); renderAll(); }
  else if(activePeriodId) await loadPeriodData(activePeriodId);
}

/* 앱 전체가 쓰는 저장 함수 — 항상 이 기기(localStorage)에는 즉시 저장되고,
   Supabase 연동이 설정돼 있으면 즉시 Supabase 테이블에도 동기화됩니다. */
function safeGet(key){ return Object.prototype.hasOwnProperty.call(dbCache, key) ? dbCache[key] : null; }
async function safeSet(key,val){ dbCache[key]=val; persistLocalDB(); return sbConfig ? supabaseUpsert(key, val) : true; }
async function safeDelete(key){ delete dbCache[key]; persistLocalDB(); return sbConfig ? supabaseDeleteKey(key) : true; }

function showSaveError(msg){
  let banner = document.getElementById('saveErrorBanner');

    document.body.appendChild(banner);
  }
  banner.textContent = msg || '⚠️ 저장에 실패했어요. 잠시 후 다시 시도해주세요.';
  banner.style.display = 'block';
  clearTimeout(banner._hideTimer);
  banner._hideTimer = setTimeout(()=>{ banner.style.display='none'; }, 5000);
}

document.getElementById('connectSbBtn').addEventListener('click', async ()=>{

function escapeHtml(t){ return String(t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 앱 제목 (모든 기기 공통: settings:title) ---------- */

/* ---------- 설정: 화면 모드 · 배경 색상 (기기마다 따로 저장) ---------- */
const PASTELS = ['#ffd6d6','#ffe4c2','#fff3b0','#e2f3c9','#c9ecd9','#c7ecee','#cfe0ff','#dcd0ff','#f6d1e6'];
const BGINT_STEPS = [[10,0,'연하게'],[30,10,'보통'],[60,20,'진하게']];
const BG_VARS = ['--bg','--paper','--cell','--soft','--line','--dot','--bg-tint'];
let THEME = 'light', BGCOLOR = '', BGINT = 30;
try{
  THEME = localStorage.getItem('stamp-theme') || 'light';
  BGCOLOR = localStorage.getItem('stamp-bgcolor') || '';
  BGINT = Number(localStorage.getItem('stamp-bgint')) || 30;
}catch(e){}

function isDarkNow(){
  if(THEME==='dark') return true;
  if(THEME==='light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const root = document.documentElement;
  if(THEME==='light' || THEME==='dark') root.setAttribute('data-theme', THEME);
  else root.removeAttribute('data-theme');
  document.querySelector('meta[name="theme-color"]').setAttribute('content', isDarkNow() ? '#1B1820' : '#8067DC');
}
function mixWithWhite(hex, pct){
  const t = pct/100;
  const [r,g,b] = [1,3,5].map(i=>Math.round(parseInt(hex.slice(i,i+2),16)*t + 255*(1-t)));
  return `rgb(${r}, ${g}, ${b})`;
}
function applyBg(){
  const root = document.documentElement;
  if(BGCOLOR && !isDarkNow()){
    const [bgPct, cardPct] = BGINT_STEPS.find(s=>s[0]===BGINT) || BGINT_STEPS[1];
    root.style.setProperty('--bg', mixWithWhite(BGCOLOR, bgPct));
    root.style.setProperty('--paper', mixWithWhite(BGCOLOR, cardPct));
    root.style.setProperty('--cell', mixWithWhite(BGCOLOR, cardPct + 8));
    root.style.setProperty('--soft', mixWithWhite(BGCOLOR, cardPct + 25));
    root.style.setProperty('--line', mixWithWhite(BGCOLOR, cardPct + 35));
    root.style.setProperty('--dot', 'rgba(0,0,0,0.05)');
    root.style.setProperty('--bg-tint', 'transparent');
  } else {
    BG_VARS.forEach(v=>root.style.removeProperty(v));
  }
}
try{
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(THEME==='system'){ applyTheme(); applyBg(); }
  });
}catch(e){}

function renderCfg(){
  document.getElementById('appTitleInput').value = document.getElementById('appTitle').textContent;
  document.getElementById('titleErr').textContent = '';
  document.getElementById('cfgSub').textContent = `v${APP_VERSION} · ${sbConfig ? 'Supabase 연동됨' : '이 기기에만 저장'}`;
  document.querySelectorAll('#cfgOverlay input[name="theme"]').forEach(r=>{ r.checked = r.value===THEME; });
  document.getElementById('bgColorGrid').innerHTML =
    `<button class="csw${BGCOLOR?'':' on'}" data-bg="" aria-label="기본 배경색">✕</button>` +
    PASTELS.map(c=>`<button class="csw${BGCOLOR===c?' on':''}" data-bg="${c}" style="background:${c}" aria-label="파스텔 배경색"></button>`).join('');
  document.getElementById('bgIntRow').innerHTML = BGCOLOR
    ? BGINT_STEPS.map(([v,,label])=>`<button class="pill${BGINT===v?' on':''}" data-int="${v}">${label}</button>`).join('')
    : '';
}

document.getElementById('bgFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  const err = document.getElementById('bgErr');
  err.textContent = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ err.textContent='이미지 파일만 선택할 수 있어요.'; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim){
        if(w > h){ h = Math.round(h * maxDim/w); w = maxDim; }
        else { w = Math.round(w * maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      if(dataUrl.length > 1.8*1024*1024){ err.textContent='이미지 용량이 너무 커요. 다른 사진을 선택해주세요.'; return; }
      await safeSet('settings:bgImage', dataUrl);
      document.getElementById('bgLayer').style.backgroundImage = `url(${dataUrl})`;
      document.body.classList.add('has-bg');
      bgPreview.style.backgroundImage = `url(${dataUrl})`;
      bgPreview.textContent = '';
    };
    img.onerror = ()=>{ err.textContent='이미지를 불러오지 못했어요.'; };
    img.src = ev.target.result;
  };
  reader.onerror = ()=>{ err.textContent='파일을 읽지 못했어요.'; };
  reader.readAsDataURL(file);
});

document.getElementById('clearBgBtn').addEventListener('click', async ()=>{

/* ---------- 데이터 로드 ---------- */
async function loadPeriods(){
  const raw = await safeGet('periods:list');
  periods = raw ? JSON.parse(raw) : [];
}
/* 도장은 하루에 한 행(stamp:YYYY-MM-DD)으로 저장하고, 월별·목표기간 캘린더가 같이 읽는다.
   하루 단위라서 여러 기기가 서로 다른 날짜에 찍어도 서로 덮어쓰지 않는다. */
function readStamp(ds){
  const raw = safeGet(stampKey(ds));
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function periodDates(p){
  const out = [];
  const end = new Date(p.end+'T00:00:00');
  for(const d = new Date(p.start+'T00:00:00'); d <= end; d.setDate(d.getDate()+1)) out.push(dateStr(d));
  return out;
}
function countStampsInPeriod(p){
  return periodDates(p).filter(ds=>{ const entry = readStamp(ds); return entry && entry.e; }).length;
}

/* 예전 버전은 월별(stamps:YYYY-MM)과 목표기간(periodStamps:<id>) 도장을 한 덩어리씩 따로 저장했다.
   하루 단위로 옮기고, 같은 날이 겹치면 월별 쪽을 남긴다. 이미 하루 단위 값이 있으면 그걸 우선한다.
   서버 저장이 실패하면 옛 데이터를 지우지 않아서 다음 실행 때 다시 시도한다. */
async function migrateLegacyStamps(){
  const legacyKeys = Object.keys(dbCache).filter(k=>/^stamps:\d{4}-\d{2}$/.test(k) || k.startsWith('periodStamps:'));
  if(!legacyKeys.length) return;
  const readBlob = k=>{ try{ return JSON.parse(dbCache[k] || '{}') || {}; }catch(e){ return {}; } };
  const hasContent = entry=> entry && (entry.e || entry.note);
  const merged = {};
  legacyKeys.filter(k=>k.startsWith('periodStamps:')).forEach(k=>{
    Object.entries(readBlob(k)).forEach(([ds, entry])=>{ if(hasContent(entry) && !merged[ds]) merged[ds] = entry; });
  });
  legacyKeys.filter(k=>k.startsWith('stamps:')).forEach(k=>{
    const ym = k.slice('stamps:'.length);
    Object.entries(readBlob(k)).forEach(([day, entry])=>{ if(hasContent(entry)) merged[`${ym}-${pad(Number(day))}`] = entry; });
  });
  const entries = Object.entries(merged)
    .filter(([ds])=> !Object.prototype.hasOwnProperty.call(dbCache, stampKey(ds)))
    .map(([ds, entry])=>[stampKey(ds), JSON.stringify(entry)]);
  entries.forEach(([k, v])=>{ dbCache[k] = v; });
  persistLocalDB();
  if(entries.length && !(await supabaseUpsertRows(entries))) return;
  for(const k of legacyKeys){ await safeDelete(k); }
}

async function loadPeriodData(id){
  periodStampData = {};
  const p = periods.find(x=>x.id===id);
  if(p) periodDates(p).forEach(ds=>{ const entry = readStamp(ds); if(entry) periodStampData[ds] = entry; });
  renderAll();
}
async function saveMonthGoal(val){ await safeSet(goalKey(current), String(val)); }
async function savePeriodsList(){ await safeSet('periods:list', JSON.stringify(periods)); }

async function refreshData(){
  if(sbConfig){
    setSyncStatus('☁️ 새로고침 중...');
    const result = await supabaseLoadAll();
    setSyncStatus(result.ok ? '☁️ Supabase 연동됨' : '⚠️ Supabase 연결 실패 — 이 기기 저장 데이터로 표시 중');
    if(result.ok) await migrateLegacyStamps();
  }
  await reloadCurrentView();
}

function progressMsgText(count, goal, label){
  const pct = goal>0 ? count/goal : 0;
  if(count===0) return `${label} 도장을 모아볼까요?`;
  if(pct<0.3) return `${label} 좋은 시작이에요! 👏`;
  if(pct<0.7) return `${label} 점점 늘고 있어요! 🙌`;
  if(pct<1) return `${label} 조금만 더 힘내요! 🔥`;
  return `${label} 목표 달성! 최고예요 🎉`;
}
function progressBlock(id, titleText, count, goal, msg){
  const pct = goal>0 ? count/goal : 0;
  const isComplete = pct>=1 && count>0;
  return `
    <div class="progress-block">
      <div class="progress-label">${titleText}</div>
      <div class="progress-msg">${msg}</div>
      <div class="progress-bar"><div class="progress-fill${isComplete?' complete':''}" style="width:${Math.min(100,Math.round(pct*100))}%"></div></div>
      <div class="goal-row">
        <span><span class="count-num" data-target="${count}">${count}</span>개</span>
        <span>목표 <input data-goal-id="${id}" type="number" min="1" max="500" value="${goal}"/>개</span>
      </div>
    </div>`;
}

function monthDate(offset){ return new Date(current.getFullYear(), current.getMonth()+offset, 1); }

/* 한 달치 "페이지" HTML. 현재 달과 슬라이드 중 옆에 붙는 달이 같은 함수로 만들어져서 모양이 똑같다. */
function monthPageHTML(d){
  const y = d.getFullYear(), m = d.getMonth();
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const goal = parseInt(safeGet(goalKey(d))) || 20;
  const today = new Date();
  const isThisMonth = today.getFullYear()===y && today.getMonth()===m;
  let count = 0, cells = '<div class="cell empty"></div>'.repeat(firstDay);
  for(let day=1; day<=daysInMonth; day++){
    const dow = (firstDay+day-1)%7;
    const entry = readStamp(dateStr(new Date(y, m, day)));
    if(entry && entry.e) count++;
    const cls = 'cell'+(dow===0?' sun':'')+(dow===6?' sat':'')+(isThisMonth && today.getDate()===day?' today':'');
    cells += `<div class="${cls}" data-key="${day}"><div class="daynum">${day}</div>`
      + (entry && entry.e ? `<div class="stamp"><div class="ring" style="color:${entry.color}"></div><div class="badge">${entry.e}</div></div>` : '')
      + (entry && entry.note ? '<div class="note-dot"></div>' : '')
      + '</div>';
  }
  return `<section class="page">
    <h2 class="page-title">${y}년 ${m+1}월</h2>
    ${progressBlock('month','🗓️ 이번 달 목표', count, goal, progressMsgText(count, goal, '지안이'))}
    <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid">${cells}</div>
  </section>`;
}

/* ---------- 월 슬라이드: 손가락을 따라 움직이고, 놓으면 남은 거리를 부드럽게 마저 이동 ---------- */
const SLIDE_MS = 320, SLIDE_EASE = 'cubic-bezier(.22,.8,.3,1)';
const SLIDE_COMMIT_RATIO = 0.3;      // 화면 폭의 30% 이상 밀면 다음 달로
const SLIDE_COMMIT_SPEED = 0.5;      // 또는 이 속도(px/ms) 이상으로 튕기면
let slide = null;                    // 진행 중인 슬라이드 하나만. { pager, track, W, heights, dx, samples, mode }
let suppressTapUntil = 0;

/* jump: 이전/다음 달 자리에 대신 붙일 먼 달(오늘로 돌아가기용). 없으면 바로 이웃한 달. */
function prepareSlide(jump){
  const pager = document.getElementById('pager');
  if(!pager || topTab!=='month') return null;
  const track = pager.firstElementChild;
  const W = pager.clientWidth;
  const idx = d=> d.getFullYear()*12 + d.getMonth();
  const prevMonth = jump && idx(jump) < idx(current) ? jump : monthDate(-1);
  const nextMonth = jump && idx(jump) > idx(current) ? jump : monthDate(1);
  pager.style.height = track.firstElementChild.offsetHeight + 'px';   // 달마다 줄 수가 달라도 높이가 튀지 않게
  pager.classList.add('sliding');
  track.style.transition = 'none';
  track.insertAdjacentHTML('afterbegin', monthPageHTML(prevMonth));
  track.insertAdjacentHTML('beforeend', monthPageHTML(nextMonth));
  track.style.transform = `translateX(${-W}px)`;
  return { pager, track, W, heights:[...track.children].map(p=>p.offsetHeight), dx:0, samples:[], mode:'drag', jump:jump||null };
}

function settleSlide(s, dir){   // dir: -1 이전 달, 0 제자리, +1 다음 달
  s.mode = 'settling';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = reduced ? 0 : SLIDE_MS;
  suppressTapUntil = performance.now() + ms + 120;   // 이동 중에는 아직 이전 달 기준이라 날짜 탭을 무시
  void s.track.offsetWidth;   // 드래그 중 위치를 확정한 뒤에 전환을 시작
  s.track.style.transition = ms ? `transform ${ms}ms ${SLIDE_EASE}` : 'none';
  s.pager.style.transition = ms ? `height ${ms}ms ${SLIDE_EASE}` : 'none';
  s.track.style.transform = `translateX(${-(1+dir)*s.W}px)`;
  s.pager.style.height = s.heights[1+dir] + 'px';
  let done = false;
  const finish = ()=>{
    if(done) return;
    done = true;
    s.track.removeEventListener('transitionend', onEnd);
    slide = null;
    if(topTab!=='month') return;
    if(dir!==0) current = s.jump ? new Date(s.jump) : monthDate(dir);
    navDirection = 'none';   // 이미 움직임이 끝났으니 다시 그릴 때는 그대로
    renderAll();
  };
  const onEnd = e=>{ if(e.target===s.track && e.propertyName==='transform') finish(); };
  s.track.addEventListener('transitionend', onEnd);
  setTimeout(finish, ms + 80);
}

function changeMonth(delta){   // ‹ › 버튼
  if(slide) return;
  const s = prepareSlide();
  if(!s){ current = monthDate(delta); renderAll(); return; }
  slide = s;
  settleSlide(s, delta);
}

function todayMonth(){ const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), 1); }
function isCurrentMonthShown(){ const t = todayMonth(); return t.getFullYear()===current.getFullYear() && t.getMonth()===current.getMonth(); }

function goToday(){   // "오늘" 버튼: 몇 달 떨어져 있어도 이번 달이 옆에서 한 번에 밀려 들어온다
  if(slide || isCurrentMonthShown()) return;
  const target = todayMonth();
  const dir = target > current ? 1 : -1;
  const s = prepareSlide(target);
  if(!s){ current = target; renderAll(); return; }
  slide = s;
  settleSlide(s, dir);
}

/* 손을 떼는 순간 기준 최근 100ms 동안의 속도(px/ms). 그 사이에 움직임이 없었으면 0 —
   느리게 끌다가 멈춘 뒤 놓은 건 튕긴 게 아니다. */
function slideVelocity(s){
  const now = performance.now();
  const recent = s.samples.filter(p=> now - p.t <= 100);
  if(recent.length < 2) return 0;
  const first = recent[0], last = recent[recent.length-1];
  return last.t > first.t ? (last.x - first.x) / (last.t - first.t) : 0;
}

let swipeStart = null;   // 손가락이 닿은 뒤 아직 가로/세로가 정해지기 전의 시작점
mainArea.addEventListener('touchstart', e=>{
  swipeStart = null;
  if(topTab!=='month' || slide || e.touches.length!==1 || document.querySelector('.overlay.show')) return;
  swipeStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, t:performance.now() };
}, {passive:true});

mainArea.addEventListener('touchmove', e=>{
  const x = e.touches[0].clientX, y = e.touches[0].clientY;
  if(swipeStart){
    const dx = x - swipeStart.x, dy = y - swipeStart.y;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
    const start = swipeStart;
    swipeStart = null;
    if(Math.abs(dy) >= Math.abs(dx)) return;   // 세로로 움직이면 당겨서 새로고침이 맡는다
    const s = prepareSlide();
    if(!s) return;
    slide = s;
    s.x0 = x;                                   // 판정에 쓴 거리는 빼고, 이 순간부터 손가락을 따라간다
    s.samples.push({ x:start.x, t:start.t }, { x, t:performance.now() });   // 판정 전에 움직인 것도 속도에 반영
    return;
  }
  if(!slide || slide.mode!=='drag') return;
  e.preventDefault();
  slide.dx = Math.max(-slide.W, Math.min(slide.W, x - slide.x0));
  slide.track.style.transform = `translateX(${-slide.W + slide.dx}px)`;
  slide.samples.push({ x, t:performance.now() });
  if(slide.samples.length > 8) slide.samples.shift();
}, {passive:false});

function endSwipe(cancelled){
  swipeStart = null;
  if(!slide || slide.mode!=='drag') return;
  const s = slide;
  suppressTapUntil = performance.now() + 350;   // 밀고 뗄 때 날짜 칸이 눌린 것으로 처리되지 않게
  const v = slideVelocity(s);
  let dir = 0;
  if(!cancelled && (Math.abs(s.dx) > s.W*SLIDE_COMMIT_RATIO || (Math.abs(v) > SLIDE_COMMIT_SPEED && Math.abs(s.dx) > 24))){
    dir = s.dx < 0 ? 1 : -1;
  }
  settleSlide(s, dir);
}
mainArea.addEventListener('touchend', ()=> endSwipe(false));
mainArea.addEventListener('touchcancel', ()=> endSwipe(true));

function renderPeriodList(){
  let cardsHtml = '';
  if(periods.length===0){
    cardsHtml = `<div class="empty-msg">아직 만든 목표기간이 없어요.<br>아래에서 새로 만들어보세요!</div>`;
  } else {
    cardsHtml = periods.map(p=>{
      const count = countStampsInPeriod(p);
      const pct = Math.min(100, Math.round((count/p.goal)*100));
      return `
        <div class="period-card" data-id="${p.id}">
          <div class="period-card-head">
            <strong>🎯 ${escapeHtml(p.name)}</strong>
            <span>${p.start} ~ ${p.end}</span>
          </div>
          <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
          <div class="mini-count">${count} / ${p.goal}개</div>
        </div>`;
    }).join('');
  }
  mainArea.innerHTML = `
    <div class="card">
      <div class="month-nav"><h2>🎯 목표기간 캘린더</h2></div>
      ${cardsHtml}
      <button class="add-period-btn" id="addPeriodBtn">+ 새 목표기간 만들기</button>
    </div>`;
  mainArea.querySelectorAll('.period-card').forEach(card=>{
    card.addEventListener('click', async ()=>{
      activePeriodId = card.dataset.id; periodSub='detail';
      await loadPeriodData(activePeriodId);
    });
  });
  document.getElementById('addPeriodBtn').addEventListener('click', openPeriodCreate);
  animateMainAreaIn(navDirection); navDirection=null;
}

function renderPeriodDetail(){
  const p = periods.find(x=>x.id===activePeriodId);
  if(!p){ periodSub='list'; renderAll(); return; }
  const start = new Date(p.start+'T00:00:00');
  const end = new Date(p.end+'T00:00:00');
  const count = Object.values(periodStampData).filter(v=>v && v.e).length;
  const spansMultipleMonths = start.getFullYear()!==end.getFullYear() || start.getMonth()!==end.getMonth();

  mainArea.innerHTML = `
    <div class="card">
      <div class="month-nav">
        <button class="back" id="backToListBtn">← 목록</button>
        <h2 class="editable"><span>🎯 ${escapeHtml(p.name)}</span><button class="edit-title" id="renamePeriodBtn" aria-label="이름 바꾸기">✏</button></h2>
        <button class="del" id="delPeriodBtn">삭제</button>
      </div>
      <div class="period-info">${p.start} ~ ${p.end}</div>
      ${progressBlock('period','🎯 기간 목표', count, p.goal, progressMsgText(count, p.goal, '지안이'))}
      <div class="weekdays"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
      <div class="grid" id="grid"></div>
    </div>`;

  document.getElementById('backToListBtn').addEventListener('click', async ()=>{
    periodSub='list'; renderAll();
  });
  mainArea.querySelector('[data-goal-id="period"]').addEventListener('change', e=>{
    p.goal = parseInt(e.target.value)||10;
    savePeriodsList().then(renderPeriodDetail);
  });

  document.getElementById('renamePeriodBtn').addEventListener('click', ()=> openRename(p));

  let delConfirming = false;
  document.getElementById('delPeriodBtn').addEventListener('click', function(){
    if(!delConfirming){
      delConfirming = true; this.textContent='정말 삭제?';
      setTimeout(()=>{ delConfirming=false; this.textContent='삭제'; }, 2500);
      return;
    }
    periods = periods.filter(x=>x.id!==p.id);
    savePeriodsList().then(()=>{ periodSub='list'; renderAll(); });
  });

  const grid = document.getElementById('grid');
  const firstDow = start.getDay();
  for(let i=0;i<firstDow;i++){ const d=document.createElement('div'); d.className='cell empty'; grid.appendChild(d); }

  const today = new Date();
  let d = new Date(start);
  while(d <= end){
    const ds = dateStr(d);
    const dow = d.getDay();
    const cell = document.createElement('div');
    const isToday = dateStr(today)===ds;
    cell.className = 'cell'+(dow===0?' sun':'')+(dow===6?' sat':'')+(isToday?' today':'');
    cell.dataset.key = ds;
    const label = spansMultipleMonths ? `${d.getMonth()+1}/${d.getDate()}` : `${d.getDate()}`;
    cell.innerHTML = `<div class="daynum">${label}</div>`;
    const entry = periodStampData[ds];
    if(entry && entry.e) cell.innerHTML += `<div class="stamp"><div class="ring" style="color:${entry.color}"></div><div class="badge">${entry.e}</div></div>`;
    if(entry && entry.note) cell.innerHTML += `<div class="note-dot"></div>`;
    cell.addEventListener('click', ()=> openDaySheet(ds, entry));
    grid.appendChild(cell);
    d.setDate(d.getDate()+1);
  }
  animateMainAreaIn(navDirection); navDirection=null;
  animateCountUps();
}

/* ---------- 도장/메모 시트 ---------- */
function openDaySheet(key, entry){
  selectedKey = key;
  pendingSticker = entry && entry.e ? {e:entry.e, color:entry.color} : null;
  noteInput.value = entry && entry.note ? entry.note : '';
  if(topTab==='month'){
    const y = current.getFullYear(), m = current.getMonth()+1;
    sheetDateLabel.textContent = `${m}월 ${key}일 기록하기`;
  } else {
    sheetDateLabel.textContent = `${key} 기록하기`;
  }
  highlightSelectedSticker();
  overlay.classList.add('show');
}
function closeSheet(){ overlay.classList.remove('show'); selectedKey=null; pendingSticker=null; }
function highlightSelectedSticker(){
  [...stickerGrid.children].forEach(btn=>{
    btn.classList.toggle('selected', pendingSticker && btn.textContent===pendingSticker.e);
  });
}
function buildStickerGrid(){
  stickerGrid.innerHTML='';
  STICKERS.forEach(s=>{
    const b = document.createElement('div');
    b.className='sticker-btn'; b.textContent=s.e; b.style.borderColor=s.color+'55';
    b.addEventListener('click', ()=>{
      pendingSticker = (pendingSticker && pendingSticker.e===s.e) ? null : {e:s.e, color:s.color};
      highlightSelectedSticker();
    });
    stickerGrid.appendChild(b);
  });
}
/* selectedKey는 월별 화면에선 날짜 숫자, 목표기간 화면에선 'YYYY-MM-DD'. 어느 쪽이든 같은 하루 행에 저장한다. */
async function saveSelectedDay(entry){
  const ds = topTab==='month' ? dateStr(new Date(current.getFullYear(), current.getMonth(), selectedKey)) : selectedKey;
  if(entry){ await safeSet(stampKey(ds), JSON.stringify(entry)); }
  else { await safeDelete(stampKey(ds)); }
  if(topTab!=='month'){ if(entry) periodStampData[selectedKey] = entry; else delete periodStampData[selectedKey]; }
}

async function saveDay(){
  if(selectedKey==null) return;
  const note = noteInput.value.trim();
  const newEntry = (!pendingSticker && !note) ? null : { e: pendingSticker?pendingSticker.e:null, color: pendingSticker?pendingSticker.color:null, note };

  const saveBtn = document.getElementById('saveDayBtn');
  const originalLabel = saveBtn.textContent;
  if(sbConfig){ saveBtn.textContent = '저장 중...'; saveBtn.disabled = true; }

  await saveSelectedDay(newEntry);

  saveBtn.textContent = originalLabel; saveBtn.disabled = false;

  const stickerToAnimate = pendingSticker;
  const savedKey = selectedKey;
  closeSheet();
  renderAll();
  if(stickerToAnimate){ burstConfetti(stickerToAnimate.color); animateStampPop(savedKey); }
}
document.getElementById('saveDayBtn').addEventListener('click', saveDay);
document.getElementById('removeStampBtn').addEventListener('click', async function(){
  if(selectedKey==null) return;
  const originalLabel = this.textContent;
  if(sbConfig){ this.textContent = '지우는 중...'; this.disabled = true; }

  await saveSelectedDay(null);

  this.textContent = originalLabel; this.disabled = false;
  closeSheet();
  renderAll();
});
document.getElementById('closeSheet').addEventListener('click', closeSheet);
overlay.addEventListener('click', e=>{ if(e.target===overlay) closeSheet(); });

/* ---------- 목표기간 생성 ---------- */
function openPeriodCreate(){
  document.getElementById('periodName').value='';
  document.getElementById('periodStart').value='';
  document.getElementById('periodEnd').value='';
  document.getElementById('periodGoal').value=10;
  document.getElementById('periodErr').textContent='';
  periodOverlay.classList.add('show');
}
document.getElementById('closePeriodSheet').addEventListener('click', ()=> periodOverlay.classList.remove('show'));
periodOverlay.addEventListener('click', e=>{ if(e.target===periodOverlay) periodOverlay.classList.remove('show'); });
document.getElementById('savePeriodBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('periodName').value.trim();
  const start = document.getElementById('periodStart').value;
  const end = document.getElementById('periodEnd').value;
  const goal = parseInt(document.getElementById('periodGoal').value)||10;
  const err = document.getElementById('periodErr');
  if(!name){ err.textContent='캘린더 이름을 입력해주세요.'; return; }
  if(!start || !end){ err.textContent='시작일과 종료일을 선택해주세요.'; return; }
  if(start > end){ err.textContent='종료일은 시작일보다 뒤여야 해요.'; return; }
  const id = Date.now().toString(36);
  periods.push({id, name, start, end, goal});
  await savePeriodsList();
  periodOverlay.classList.remove('show');
  activePeriodId = id; periodSub='detail';
  await loadPeriodData(id);
});

/* ---------- 목표기간 이름 바꾸기 ---------- */
const renameOverlay = document.getElementById('renameOverlay');
function openRename(p){
  document.getElementById('renameInput').value = p.name;
  document.getElementById('renameErr').textContent = '';
  renameOverlay.dataset.id = p.id;
  renameOverlay.classList.add('show');
}
document.getElementById('closeRenameSheet').addEventListener('click', ()=> renameOverlay.classList.remove('show'));
renameOverlay.addEventListener('click', e=>{ if(e.target===renameOverlay) renameOverlay.classList.remove('show'); });
document.getElementById('saveRenameBtn').addEventListener('click', async function(){
  const name = document.getElementById('renameInput').value.trim();
  const err = document.getElementById('renameErr');
  const p = periods.find(x=>x.id===renameOverlay.dataset.id);
  if(!name){ err.textContent = '캘린더 이름을 입력해주세요.'; return; }
  if(!p){ renameOverlay.classList.remove('show'); return; }
  this.disabled = true; this.textContent = '저장 중...';
  p.name = name;
  await savePeriodsList();
  this.disabled = false; this.textContent = '저장하기';
  renameOverlay.classList.remove('show');
  if(topTab==='period' && periodSub==='detail' && activePeriodId===p.id) renderPeriodDetail();
});

function burstConfetti(color){
  const colors=[color,'#FFD166','#8067DC','#7FD1C0'];
  for(let i=0;i<14;i++){
    const c=document.createElement('div'); c.className='confetti'; c.style.background=colors[i%colors.length];
    const x=window.innerWidth/2+(Math.random()*60-30), y=window.innerHeight/2+(Math.random()*60-30);
    c.style.left=x+'px'; c.style.top=y+'px'; document.body.appendChild(c);
    const angle=Math.random()*Math.PI*2, dist=60+Math.random()*90;
    const dx=Math.cos(angle)*dist, dy=Math.sin(angle)*dist-40;
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+120}px) rotate(${Math.random()*360}deg)`, opacity:0}
    ], {duration:700+Math.random()*300, easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>c.remove(),1100);
  }
}

/* ---------- 앱 복귀 시 재연결: 모바일에서 화면을 끄거나 백그라운드로 보내면
   Realtime 웹소켓 연결이 끊기고 자동으로는 안 붙는 경우가 있어, 화면이
   다시 보이거나 네트워크가 돌아오면 데이터도 새로 받고 연결도 다시 맺는다. ---------- */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && sbConfig){
    refreshData();
    reconnectRealtime();
  }
});
window.addEventListener('online', ()=>{
  if(sbConfig){
    refreshData();
    reconnectRealtime();
  }
});

/* ---------- 당겨서 새로고침 ---------- */
const pullIndicator = document.getElementById('pullIndicator');
let pullStartY = 0, pullStartX = 0, pulling = false, pullDist = 0, refreshing = false;
const PULL_THRESHOLD = 70, PULL_MAX = 100;

document.addEventListener('touchstart', e=>{
  if(refreshing || document.querySelector('.overlay.show')) return;
  if(window.scrollY<=0){ pullStartY = e.touches[0].clientY; pullStartX = e.touches[0].clientX; pulling = true; }
}, {passive:true});

document.addEventListener('touchmove', e=>{
  if(!pulling || refreshing) return;
  if(document.querySelector('.overlay.show')){ pulling=false; return; }
  const dy = e.touches[0].clientY - pullStartY;
  const dx = e.touches[0].clientX - pullStartX;
  if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)){
    // Sideways finger movement is a month swipe, not a pull.
    pulling = false; pullDist = 0; pullIndicator.style.opacity = '0';
    return;
  }
  if(dy<=0 || window.scrollY>0){ return; }
  pullDist = Math.min(dy*0.5, PULL_MAX);
  const progress = Math.min(1, pullDist/PULL_THRESHOLD);
  pullIndicator.style.transition = 'none';
  pullIndicator.style.opacity = '1';
  pullIndicator.style.width = `${progress*100}%`;
  if(dy>6) e.preventDefault();
}, {passive:false});

document.addEventListener('touchend', ()=>{
  if(!pulling || refreshing) return;
  pulling = false;
  pullIndicator.style.transition = 'opacity .25s ease';
  if(pullDist >= PULL_THRESHOLD){ startPullRefresh(); }
  else{ pullIndicator.style.opacity = '0'; }
  pullDist = 0;
});

async function startPullRefresh(){
  refreshing = true;
  pullIndicator.style.opacity = '1';
  pullIndicator.classList.add('refreshing');
  const minWait = new Promise(r=>setTimeout(r, 500));
  await Promise.all([refreshData(), minWait]);
  pullIndicator.style.opacity = '0';
  await new Promise(r=>setTimeout(r, 250));
  pullIndicator.classList.remove('refreshing');
  refreshing = false;
}

async function init(){
  buildStickerGrid();
  document.getElementById('appVersion').textContent = 'v' + APP_VERSION;
  loadLocalDB();
  applyTitle();
  sbConfig = loadSbConfig();
  let loaded = !sbConfig;
  if(sbConfig){
    setSyncStatus('☁️ Supabase에서 불러오는 중...');
    const result = await supabaseLoadAll();
    loaded = result.ok;
    if(result.ok){ setSyncStatus('☁️ Supabase 연동됨'); connectRealtime(); }
    else { setSyncStatus('⚠️ Supabase 연결 실패 — 이 기기 저장 데이터로 표시 중'); }
  }
  // Only migrate from data we trust to be current; a failed load leaves a possibly stale local cache.
  if(loaded) await migrateLegacyStamps();
  await loadBg();
  applyTitle();
  renderAll();
}
init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
